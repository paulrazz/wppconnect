<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CommNexus | WhatsApp Routing Engine</title>
    <script>
      // Apply the saved theme BEFORE paint so reloads never flash the wrong
      // theme (FOUC). Runs inline so it executes before the bundle loads.
      (function () {
        try {
          var t = localStorage.getItem('theme');
        } catch (_) { t = null; }
        if (t !== 'light') t = 'dark';
        var root = document.documentElement;
        root.classList.add(t);
        root.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
